<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
	
	<link rel="icon" type="image/x-icon" href="./img/favicon.ico">
	
	<!--Bootstrap CSS and Script-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	
	<!--Menu Bar CSS and Script-->
    <link rel="stylesheet" href="css/bootnavbar.css" />
	<script src="./js/bootnavbar.js"></script>
	
	<!--Webpage Main CSS and Script-->
	<script src="./js/script.js"></script>
	<link rel="stylesheet" href="./css/css.css">
	
	<!--Webpage Title, description and keywords-->
    <title>CORELUX INTERIOR SUPPLY</title>
    <meta name="description" content="CORELUX INTERIOR SUPPLY"/>
    <meta name="keywords" content="CORELUX INTERIOR SUPPLY"/>	
  </head>

  <body class="coreBody">
	<!--Menu Start-->
	<div id="menuBar" menu-include-html="./menu.html"></div>
	<!--Menu End-->
	
	<!--Web Content Start-->
	<div class="hero-section">
		<div class="row">
			<div class="col-md-12" style="text-align:right; z-index:999"><button class="btn coreButton" onclick="switchDisplay();">En/中</button></div>
		</div>
		<!-- Your Content Start Here -->
		<style>
			.quanWuDingZhiDiv{
				margin-top: -38px;
			}
		</style>
		<div class="quanWuDingZhiDiv">
		<div class="container">		
			<h3 class="display-4 displayEN">Full-Home Custom</h1>
			<h3 class="display-4 displayCN">全屋定制</h1>
			<p class="displayEN">Crafting spaces and making dream homes come true</p>
			<p class="displayCN">专业空间改造，帮您实现梦想家园</p>
		
			<div id="productList" class="row" style="text-align:left;"></div>
			<script>
			let ulProductList = document.getElementById("productList");
				fetch("json/quanWuDingZhi-Gallery1.json").then((res) => res.json()).then((allProducts) => {
					for (const index in allProducts) {
						const product = allProducts[index];
						//let hrefProperty ="";
						ulProductList.insertAdjacentHTML(
							"beforeend",
							`
							<div class="col-md-4">
								<img type="button" data-bs-toggle="modal" data-bs-target="#photoDetail" onclick="updateQWDZPhoto('${product.sku}','${product.title}','${product.titleCN}','${product.images[0]}','${product.images[1]}','${product.images[2]}','${product.images[3]}','${product.images[4]}','${product.images[5]}','${product.description}','${product.descriptionCN}');" width="324" height="324" src="${product.display_image}" class="flooring-thumbnail" alt="${product.title}" loading="lazy" sizes="(max-width: 324px) 100vw, 324px">						
								<h2 class="floorTitle displayEN">${product.title}</h2>
								<h2 class="floorTitle displayCN">${product.titleCN}</h2>
								<div class="floorSku">${product.sku}</div>
							</div>
							`
						);
					}
                });
			</script>
		</div>
		
<!-- The Modal Start-->
<div class="modal" id="photoDetail">
  <div class="modal-dialog coreModal">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title displayEN" id="productName">TaTa Full-Home Custom</h4>
		<h4 class="modal-title displayCN" id="productNameCN">TaTa Full-Home Custom</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <!-- Modal body -->
      <div class="modal-body">
			<div class="slideshow-container" style="padding-bottom:10px;">
				<ul class="pagination justify-content-center"> 
					<li class="page-item dotShow active"><a class="page-link" href="#" onclick="currentSlide(1)"></a></li>
					<li class="page-item dotShow"><a class="page-link" href="#"onclick="currentSlide(2)"></a></li>
					<li class="page-item dotShow"><a class="page-link" href="#"onclick="currentSlide(3)"></a></li>
					<li class="page-item dotShow"><a class="page-link" href="#"onclick="currentSlide(4)"></a></li>
					<li class="page-item dotShow"><a class="page-link" href="#"onclick="currentSlide(5)"></a></li>
					<li class="page-item dotShow"><a class="page-link" href="#"onclick="currentSlide(6)"></a></li>
 				</ul>
				<div class="mySlides " style="display: none;">
                    <img style="width: 100%" id="productImg1" src="#">
                </div>
                <div class="mySlides " style="display: none;">
                    <img style="width: 100%" id="productImg2" src="#">
                </div>
				<div class="mySlides " style="display: block;">
                    <img style="width: 100%" id="productImg3" src="#">
                </div>
				<div class="mySlides " style="display: block;">
                    <img style="width: 100%" id="productImg4" src="#">
                </div>
				<div class="mySlides " style="display: block;">
                    <img style="width: 100%" id="productImg5" src="#">
                </div>
				<div class="mySlides " style="display: block;">
                    <img style="width: 100%" id="productImg6" src="#">
                </div>
				<br/>
				<button type="button" class="btn coreButton"  onclick="plusSlides(-1)">Previous</button>
				<button type="button" class="btn coreButton" onclick="plusSlides(1)">Next</button>
				<br/>
				<script>
				//Script to Control the Picture display
					let slideIndex = 1;
                    showSlides(slideIndex);
                    function plusSlides(n) {
                      showSlides((slideIndex += n));
                    }

                    function currentSlide(n) {
                      showSlides((slideIndex = n));
                    }
					
                    function showSlides(n) {
                      let i;
                      let slides = document.getElementsByClassName("mySlides");
                      let dots = document.getElementsByClassName("dotShow");
                      if (n > slides.length) {
                        slideIndex = 1;
                      }
                      if (n < 1) {
                        slideIndex = slides.length;
                      }
                      for (i = 0; i < slides.length; i++) {
                        slides[i].style.display = "none";
                      }
                      for (i = 0; i < dots.length; i++) {
                        dots[i].className = dots[i].className.replace(" active","");
                      }
                      slides[slideIndex - 1].style.display = "block";
                      dots[slideIndex - 1].className += " active";
                    }
                </script>
            </div>
			<div class="row product-detail-top">
				<div class="col-md-12">
					<p class="product-description displayEN" id="productDescription"></p>
					<p class="product-description displayCN" id="productDescriptionCN"></p>
				</div>
			</div>
      </div>
      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn coreButton" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- The Modal End-->		
		
		
		
		
		
		
		
		
		
		
		
		
		
		
		
		
		
		<!-- Your Content End Here -->
		
    </div>
	<!--Web Content End-->
	
	<!--Footer Start-->
	<div id="footerBar" footer-include-html="./footer.html"></div>
	<!--Footer End-->

<script>
includeMenu();
includeFooter();
</script>	

	</body>
</html>
